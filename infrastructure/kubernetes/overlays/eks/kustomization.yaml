apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Replace the account, domain, table, runtime role and digest before deployment.
images:
  - name: cloudsentinel
    newName: 111111111111.dkr.ecr.us-east-1.amazonaws.com/cloudsentinel
    newTag: REPLACE_WITH_COMMIT_SHA
configMapGenerator:
  - name: cloudsentinel-config
    behavior: merge
    literals:
      - APP_ORIGIN=https://cloudsentinel.example.com
      - IDENTITY_TABLE=cloudsentinel-identity
      - AWS_REGION=us-east-1
      - CLOUDSENTINEL_AWS_PRINCIPAL_ARN=arn:aws:iam::111111111111:role/CloudSentinelRuntime
