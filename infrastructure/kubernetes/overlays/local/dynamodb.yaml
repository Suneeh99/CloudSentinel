apiVersion: v1
kind: Service
metadata:
  name: dynamodb
  namespace: cloudsentinel
spec:
  selector:
    app: dynamodb
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dynamodb
  namespace: cloudsentinel
spec:
  serviceName: dynamodb
  replicas: 1
  selector:
    matchLabels:
      app: dynamodb
  template:
    metadata:
      labels:
        app: dynamodb
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dynamodb
          image: amazon/dynamodb-local:3.1.0
          args:
            - '-jar'
            - DynamoDBLocal.jar
            - '-sharedDb'
            - '-dbPath'
            - /home/dynamodblocal/data
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /home/dynamodblocal/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
