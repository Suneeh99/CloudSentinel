apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudsentinel
resources:
  - namespace.yaml
  - service-account.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: cloudsentinel-config
    literals:
      - APP_ENV=aws
      - APP_ORIGIN=https://cloudsentinel.example.com
      - IDENTITY_TABLE=cloudsentinel-identity
      - AWS_REGION=us-east-1
